name: build-image

# Builds the fork's web + migrator images multi-arch (amd64 + arm64) and pushes
# them to GHCR. The cluster (fzymgc-house/selfhosted-cluster, epic hl-0we) pins
# these by digest. Fork of octopusreview/octopus carrying the env-gated
# EMBEDDING_DIM + QDRANT_API_KEY patch (upstream PR pending).

on:
  push:
    branches: [feat/configurable-embedding-dim, feat/generic-oidc-auth, feat/configurable-embedding-batch, master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/seanb4t/octopus
  MIGRATE_IMAGE: ghcr.io/seanb4t/octopus-migrate
  # The GitHub App slug is baked into the client bundle (NEXT_PUBLIC_*). It only
  # affects the UI "Install" deep-link; set to the intended app name and rebuild
  # if the registered slug differs (bead hl-0we.7).
  GITHUB_APP_SLUG: octopus-fzymgc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push web image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_GITHUB_APP_SLUG=${{ env.GITHUB_APP_SLUG }}
            NEXT_PUBLIC_BUILD_ID=${{ github.sha }}
            NEXT_PUBLIC_OIDC_PROVIDER_ID=authentik
            NEXT_PUBLIC_OIDC_PROVIDER_NAME=Authentik
            NEXT_PUBLIC_DISABLE_SOCIAL_LOGINS=true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push migrator image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: migrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.MIGRATE_IMAGE }}:latest
            ${{ env.MIGRATE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
